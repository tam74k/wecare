<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل جديد – البيانات</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7F72}a:hover{color:#075E55}
button,input,select{font-family:inherit}
@keyframes wcIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes wcFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(-3deg)}}
@media (prefers-reduced-motion: reduce){.wc-logo{animation:none!important}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 900px; box-sizing: border-box; background: #FFFFFF; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0E1B24; font-size: 15px; line-height: 1.6; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 8px">
    <img class="wc-logo" src="./assets/48ae18488359efdc71f19b4b8ae11645.png" alt="WE CARE – Here &amp; Near" style="height: 68px; width: auto; display: block; animation: wcIn 0.9s ease-out both, wcFloat 3.4s ease-in-out 0.9s infinite">
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.35">أنشئ حسابك</h1>
    <p style="margin: 0; font-size: 14px; color: #5B6B73">بياناتك الأساسية فقط، وتضيف سيارتك بعد التسجيل.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-name" style="font-size: 14px; font-weight: 600">الاسم</label>
      <input id="su-name" type="text" autocomplete="name" placeholder="مثال: مسعد محمود" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; padding: 0 14px; font-size: 16px; color: #0E1B24; background: #FFFFFF">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-phone" style="font-size: 14px; font-weight: 600">رقم الموبايل</label>
      <div dir="ltr" style="display: flex; align-items: center; height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; overflow: hidden">
        <span style="padding: 0 12px; height: 100%; display: flex; align-items: center; background: #F5F8F8; color: #34474F; font-size: 15px; font-weight: 600; border-right: 1px solid #D5DEE0">+20</span>
        <input id="su-phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="01xxxxxxxxx" style="flex: 1; min-width: 0; height: 100%; border: none; padding: 0 14px; font-size: 16px; color: #0E1B24; background: #FFFFFF; outline: none">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-pass" style="font-size: 14px; font-weight: 600">كلمة المرور</label>
      <input id="su-pass" type="password" autocomplete="new-password" placeholder="6 أحرف أو أرقام على الأقل" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; padding: 0 14px; font-size: 16px; color: #0E1B24; background: #FFFFFF">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-compound" style="font-size: 14px; font-weight: 600">الكمبوند</label>
      <select id="su-compound" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; padding: 0 14px; font-size: 16px; color: #0E1B24; background: #FFFFFF">
        <option>كمبوند زايد هايتس</option>
        <option>[كمبوند آخر]</option>
      </select>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="su-building" style="font-size: 14px; font-weight: 600">رقم العمارة</label>
        <input id="su-building" type="text" inputmode="numeric" placeholder="88" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; padding: 0 14px; font-size: 16px; color: #0E1B24; background: #FFFFFF; min-width: 0">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="su-group" style="font-size: 14px; font-weight: 600">المجموعة <span style="font-weight: 400; color: #5B6B73">(اختياري)</span></label>
        <input id="su-group" type="text" placeholder="C" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; padding: 0 14px; font-size: 16px; color: #0E1B24; background: #FFFFFF; min-width: 0">
      </div>
    </div>
  </form>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <a href="B-Home-New.dc.html" style="height: 54px; border-radius: 16px; background: #0B7F72; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">إنشاء الحساب</a>
    <p style="margin: 0; font-size: 12px; color: #5B6B73; text-align: center">بالضغط على "إنشاء الحساب" أنت توافق على <a href="#">الشروط</a> و<a href="#">سياسة الخصوصية</a></p>
    <p style="margin: 0; font-size: 14px; color: #34474F; text-align: center">عندك حساب؟ <a href="B-Login.dc.html" style="font-weight: 600">تسجيل الدخول</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

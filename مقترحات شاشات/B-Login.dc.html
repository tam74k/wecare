<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل الدخول</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7F72}a:hover{color:#075E55}
button,input{font-family:inherit}
@keyframes wcIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes wcFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(-3deg)}}
@media (prefers-reduced-motion: reduce){.wc-logo{animation:none!important}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0E1B24; font-size: 15px; line-height: 1.6; padding: 40px 24px 28px; display: flex; flex-direction: column; gap: 28px">

  <div style="display: flex; justify-content: center; padding-top: 12px">
    <img class="wc-logo" src="./assets/48ae18488359efdc71f19b4b8ae11645.png" alt="WE CARE – Here &amp; Near" style="height: 110px; width: auto; display: block; animation: wcIn 0.9s ease-out both, wcFloat 3.4s ease-in-out 0.9s infinite">
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.35">أهلاً بعودتك</h1>
    <p style="margin: 0; font-size: 15px; color: #5B6B73">سجّل دخولك برقم موبايلك وكلمة المرور</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="li-phone" style="font-size: 14px; font-weight: 600">رقم الموبايل</label>
      <div dir="ltr" style="display: flex; align-items: center; height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; overflow: hidden">
        <span style="padding: 0 12px; height: 100%; display: flex; align-items: center; background: #F5F8F8; color: #34474F; font-size: 15px; font-weight: 600; border-right: 1px solid #D5DEE0">+20</span>
        <input id="li-phone" type="tel" inputmode="numeric" autocomplete="username" placeholder="01xxxxxxxxx" style="flex: 1; min-width: 0; height: 100%; border: none; padding: 0 14px; font-size: 16px; color: #0E1B24; background: #FFFFFF; outline: none">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <label for="li-pass" style="font-size: 14px; font-weight: 600">كلمة المرور</label>
        <a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none; padding: 4px 0">نسيت كلمة المرور؟</a>
      </div>
      <div style="display: flex; align-items: center; height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; overflow: hidden">
        <input id="li-pass" type="{{pwType}}" autocomplete="current-password" placeholder="••••••••" style="flex: 1; min-width: 0; height: 100%; border: none; padding: 0 14px; font-size: 16px; color: #0E1B24; background: #FFFFFF; outline: none">
        <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" aria-pressed="{{pwPressed}}" style="width: 48px; height: 100%; border: none; background: transparent; color: #5B6B73; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <sc-if value="{{hidden}}" hint-placeholder-val="{{ true }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </sc-if>
          <sc-if value="{{shown}}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
          </sc-if>
        </button>
      </div>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #34474F; min-height: 44px; cursor: pointer">
      <input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: #0B7F72; margin: 0">
      تذكرني على هذا الجهاز
    </label>
  </form>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px">
    <a href="B-Mobile.dc.html" style="height: 54px; border-radius: 16px; background: #0B7F72; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">تسجيل الدخول</a>
    <p style="margin: 0; font-size: 14px; color: #34474F; text-align: center">عميل جديد؟ <a href="B-Signup-1.dc.html" style="font-weight: 600">أنشئ حسابك</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: false };
  }
  renderVals() {
    var self = this;
    var show = this.state.show;
    return {
      pwType: show ? 'text' : 'password',
      pwLabel: show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور',
      pwPressed: show ? 'true' : 'false',
      hidden: !show,
      shown: show,
      togglePw: function () { self.setState({ show: !self.state.show }); }
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إضافة سيارة جديدة</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7F72}a:hover{color:#075E55}
button,input,select{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1560px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0E1B24; font-size: 15px; line-height: 1.6">

  <header style="padding: 14px 16px 6px; display: flex; align-items: center; gap: 8px">
    <a href="B-Cars-List.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #0E1B24; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6l6 6-6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">إضافة سيارة جديدة</h1>
  </header>

  <main style="padding: 10px 20px 120px; display: flex; flex-direction: column; gap: 22px">

    <section aria-label="معاينة السيارة" style="background: #F2F5F6; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px">
      <svg width="240" height="96" viewBox="0 0 200 80" role="img" aria-label="معاينة لون السيارة">
        <path d="M10 55 L18 38 Q22 32 30 31 L60 28 L78 14 Q84 10 92 10 L130 10 Q138 10 144 15 L162 28 L182 32 Q190 34 191 42 L192 55 Q192 60 186 60 L170 60 A16 16 0 0 0 138 60 L66 60 A16 16 0 0 0 34 60 L16 60 Q10 60 10 55 Z" fill="{{carHex}}" stroke="#34474F" stroke-width="1.5" style="transition: fill 0.3s"></path>
        <path d="M86 16 L74 28 L108 28 L108 16 Z" fill="#CFE3EA" stroke="#34474F" stroke-width="1"></path>
        <path d="M114 16 L114 28 L152 28 L141 18 Q137 16 131 16 Z" fill="#CFE3EA" stroke="#34474F" stroke-width="1"></path>
        <circle cx="50" cy="60" r="12" fill="#1F2A30"></circle><circle cx="50" cy="60" r="5" fill="#9AA5AA"></circle>
        <circle cx="154" cy="60" r="12" fill="#1F2A30"></circle><circle cx="154" cy="60" r="5" fill="#9AA5AA"></circle>
      </svg>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #34474F">
        <span style="font-weight: 600">{{typeLabel}}</span>
        <span aria-hidden="true">·</span>
        <span>{{colorName}}</span>
      </div>
      <div style="width: 170px; border: 2px solid #0E1B24; border-radius: 8px; overflow: hidden; background: #FFFFFF" role="img" aria-label="معاينة رقم اللوحة">
        <div style="height: 20px; background: #1F6FB2; color: #FFFFFF; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; font-size: 10px; font-weight: 700"><span>مصر</span><span dir="ltr">EGYPT</span></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 42px">
          <span style="display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; letter-spacing: 2px; color: {{lettersColor}}; border-left: 2px solid #0E1B24">{{lettersDisp}}</span>
          <span style="display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; letter-spacing: 1px; color: {{digitsColor}}">{{digitsDisp}}</span>
        </div>
      </div>
    </section>

    <section aria-labelledby="ca-type" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; flex-direction: column">
        <h2 id="ca-type" style="margin: 0; font-size: 15px; font-weight: 700">نوع السيارة</h2>
        <span style="font-size: 12px; color: #5B6B73">سعر الباقة بيختلف حسب النوع</span>
      </div>
      <div role="radiogroup" aria-labelledby="ca-type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{types}}" as="item" hint-placeholder-count="4">
          <button type="button" role="radio" aria-checked="{{item.sel}}" onClick="{{item.pick}}" style="height: 60px; border-radius: 16px; border: 2px solid {{item.border}}; background: {{item.bg}}; color: {{item.color}}; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2.2-5.2A2 2 0 0 1 7 6.5h10a2 2 0 0 1 1.8 1.3L21 13v4a1 1 0 0 1-1 1h-1.5"></path><path d="M5.5 18H4a1 1 0 0 1-1-1v-4h18"></path><path d="M8.5 18h7"></path><circle cx="7" cy="18" r="1.5"></circle><circle cx="17" cy="18" r="1.5"></circle></svg>
            {{item.label}}
          </button>
        </sc-for>
      </div>
    </section>

    <section aria-label="الماركة والموديل" style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ca-brand" style="font-size: 15px; font-weight: 700">الماركة</label>
        <select id="ca-brand" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; padding: 0 14px; font-size: 16px; color: #0E1B24; background: #FFFFFF">
          <option>اختر الماركة</option>
          <option>تويوتا</option>
          <option>هيونداي</option>
          <option>كيا</option>
          <option>نيسان</option>
          <option>شيفروليه</option>
          <option>مرسيدس</option>
          <option>بي إم دبليو</option>
          <option>أخرى</option>
        </select>
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="ca-model" style="font-size: 15px; font-weight: 700">الموديل</label>
          <input id="ca-model" type="text" placeholder="مثال: كورولا" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; padding: 0 14px; font-size: 16px; color: #0E1B24; background: #FFFFFF; min-width: 0">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="ca-year" style="font-size: 15px; font-weight: 700">السنة <span style="font-weight: 400; font-size: 12px; color: #5B6B73">(اختياري)</span></label>
          <select id="ca-year" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; padding: 0 10px; font-size: 16px; color: #0E1B24; background: #FFFFFF; min-width: 0">
            <option>—</option>
            <option>2026</option>
            <option>2025</option>
            <option>2024</option>
            <option>2023</option>
            <option>2022</option>
            <option>أقدم</option>
          </select>
        </div>
      </div>
    </section>

    <section aria-labelledby="ca-color" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 id="ca-color" style="margin: 0; font-size: 15px; font-weight: 700">اللون</h2>
        <span style="font-size: 14px; color: #34474F; font-weight: 600">{{colorName}}</span>
      </div>
      <div role="radiogroup" aria-labelledby="ca-color" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{colors}}" as="item" hint-placeholder-count="8">
          <button type="button" role="radio" aria-checked="{{item.sel}}" aria-label="{{item.name}}" onClick="{{item.pick}}" style="height: 44px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
            <span style="width: 34px; height: 34px; border-radius: 50%; background: {{item.hex}}; border: 1px solid #C3CED1; box-shadow: {{item.ring}}; transition: box-shadow 0.2s"></span>
          </button>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="ca-plate" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="ca-plate" style="margin: 0; font-size: 15px; font-weight: 700">رقم اللوحة</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="ca-letters" style="font-size: 13px; color: #34474F">الحروف</label>
          <input id="ca-letters" type="text" maxlength="3" placeholder="أ ب ج" onInput="{{setLetters}}" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; padding: 0 14px; font-size: 18px; text-align: center; letter-spacing: 4px; color: #0E1B24; background: #FFFFFF; min-width: 0">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="ca-digits" style="font-size: 13px; color: #34474F">الأرقام</label>
          <input id="ca-digits" type="text" inputmode="numeric" maxlength="4" placeholder="1234" onInput="{{setDigits}}" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DEE0; border-radius: 14px; padding: 0 14px; font-size: 18px; text-align: center; letter-spacing: 3px; color: #0E1B24; background: #FFFFFF; min-width: 0">
        </div>
      </div>
    </section>

    <section aria-labelledby="ca-photo" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="ca-photo" style="margin: 0; font-size: 15px; font-weight: 700">صورة السيارة <span style="font-weight: 400; font-size: 12px; color: #5B6B73">(اختياري)</span></h2>
      <label for="ca-file" style="height: 96px; border-radius: 16px; border: 2px dashed #C3CED1; background: #F7F9F9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6B73; font-size: 14px; cursor: pointer">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        التقط أو ارفع صورة
      </label>
      <input id="ca-file" type="file" accept="image/*" style="position: absolute; width: 1px; height: 1px; opacity: 0">
    </section>
  </main>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 20px 22px; background: #FFFFFF; border-top: 1px solid #E2E9EA">
    <a href="B-Cars-List.dc.html" style="height: 54px; border-radius: 16px; background: #0B7F72; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">حفظ السيارة</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'sedan', color: 'white', letters: '', digits: '' };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var TYPES = [['sedan', 'سيدان'], ['hatch', 'هاتشباك'], ['suv', 'SUV / جيب'], ['van', 'فان']];
    var COLORS = [['white', 'أبيض', '#FFFFFF'], ['black', 'أسود', '#1A1F24'], ['silver', 'فضي', '#C4CBD0'], ['gray', 'رمادي', '#6B7280'], ['red', 'أحمر', '#B91C1C'], ['blue', 'أزرق', '#1D4ED8'], ['beige', 'بيج', '#D8C6A5'], ['green', 'أخضر', '#166534']];
    var AR = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
    var typeLabel = '', colorName = '', carHex = '#FFFFFF';
    var types = TYPES.map(function (t) {
      var on = t[0] === s.type;
      if (on) typeLabel = t[1];
      return { label: t[1], sel: on ? 'true' : 'false', border: on ? '#0B7F72' : '#E2E9EA', bg: on ? '#E3F2EF' : '#FFFFFF', color: on ? '#0B5F56' : '#34474F', pick: function () { self.setState({ type: t[0] }); } };
    });
    var colors = COLORS.map(function (c) {
      var on = c[0] === s.color;
      if (on) { colorName = c[1]; carHex = c[2]; }
      return { name: c[1], hex: c[2], sel: on ? 'true' : 'false', ring: on ? '0 0 0 3px #FFFFFF, 0 0 0 5px #0B7F72' : 'none', pick: function () { self.setState({ color: c[0] }); } };
    });
    var digitsAr = s.digits.replace(/[0-9]/g, function (d) { return AR[+d]; });
    return {
      types: types,
      colors: colors,
      typeLabel: typeLabel,
      colorName: colorName,
      carHex: carHex,
      lettersDisp: s.letters ? s.letters.split('').join(' ') : 'أ ب ج',
      lettersColor: s.letters ? '#0E1B24' : '#B8C4C8',
      digitsDisp: s.digits ? digitsAr : '١٢٣٤',
      digitsColor: s.digits ? '#0E1B24' : '#B8C4C8',
      setLetters: function (e) { self.setState({ letters: String(e.target.value || '').replace(/\s+/g, '').slice(0, 3) }); },
      setDigits: function (e) { self.setState({ digits: String(e.target.value || '').replace(/[^0-9٠-٩]/g, '').slice(0, 4) }); }
    };
  }
}
</script>
</body>
</html>
